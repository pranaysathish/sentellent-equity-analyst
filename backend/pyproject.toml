[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "SIM108", # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # asserts are the point of a test

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Pinned rather than left to the default, which pytest-asyncio warns is
# changing in a future release.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

# Put the backend root on sys.path so `import app` resolves however pytest is
# invoked. `python -m pytest` adds the working directory implicitly and a bare
# `pytest` does not — without this, the suite passes locally and fails in CI
# at collection time, which reads as failing tests rather than a broken import.
pythonpath = ["."]
