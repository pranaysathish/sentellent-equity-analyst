name: CI

# Runs on every push and pull request. Deployment is a separate workflow that
# depends on this one passing, so main is never deployed from a red build.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call: # lets deploy.yml reuse this as a gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Format check
        working-directory: backend
        run: ruff format --check app tests

      - name: Unit tests
        working-directory: backend
        # These cover the pure logic — persona scoring, hard-rule screening,
        # chunking and the article-dedup hashing. No database or API key needed.
        run: pytest tests -v --tb=short

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build static export
        working-directory: frontend
        run: npm run build

      - name: Verify export output
        working-directory: frontend
        # A silent change to next.config.mjs that drops `output: "export"`
        # would produce a server build and break the S3 deploy, so assert the
        # artefacts we actually ship exist.
        run: |
          test -f out/index.html
          test -f out/dashboard/index.html
          echo "Static export verified"

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: sentellent-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Proves the image actually starts and serves traffic. The health
        # endpoint deliberately does not touch the database, so this works
        # without any backing services.
        run: |
          docker run -d --name api -p 8000:8000 \
            -e ENVIRONMENT=local \
            sentellent-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "\nContainer healthy"
              docker rm -f api
              exit 0
            fi
            sleep 3
          done
          echo "Container failed to become healthy"
          docker logs api
          exit 1
