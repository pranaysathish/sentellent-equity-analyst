name: CI

# Runs on every push and pull request. Deployment is a separate workflow that
# depends on this one passing, so main is never deployed from a red build.

on:
  # Deliberately not `main`. A push there already runs the deploy workflow,
  # which calls this one as its gate — running both means two CI runs for the
  # same commit, competing for the same concurrency group. One cancels the
  # other, and when the loser is the deploy's copy the whole deploy is
  # cancelled with it. Which of the two survives is a race, which is why the
  # results looked arbitrary.
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call: # lets deploy.yml reuse this as a gate

concurrency:
  # Keyed on the calling workflow as well as the ref, so a run invoked by
  # deploy.yml never contends with a standalone one.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Format check
        working-directory: backend
        run: ruff format --check app tests

      - name: Unit tests
        working-directory: backend
        # These cover the pure logic — persona scoring, hard-rule screening,
        # chunking and the article-dedup hashing. No database or API key needed.
        # Invoked via `python -m` so the working directory is importable, which
        # `pythonpath` in pyproject.toml also guarantees independently.
        run: python -m pytest tests -v --tb=short

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build static export
        working-directory: frontend
        run: npm run build

      - name: Verify export output
        working-directory: frontend
        # A silent change to next.config.mjs that drops `output: "export"`
        # would produce a server build and break the S3 deploy, so assert the
        # artefacts we actually ship exist.
        run: |
          test -f out/index.html
          test -f out/dashboard/index.html
          echo "Static export verified"

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest

    # The app opens a database pool and runs migrations during startup, so it
    # cannot boot without Postgres. Giving the smoke test a real pgvector
    # instance turns it into a genuine integration check: it proves the image
    # starts, the migrations apply cleanly, and the readiness probe passes.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentellent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentellent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: sentellent-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image against a real database
        run: |
          # --network host so the container reaches the service container on
          # the runner's published port.
          docker run -d --name api --network host \
            -e ENVIRONMENT=local \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/sentellent \
            -e SESSION_SECRET=ci-smoke-test-secret \
            sentellent-api:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health/ready 2>/dev/null | grep -q '"status":"ready"'; then
              echo "Container healthy and migrations applied"
              docker rm -f api >/dev/null
              exit 0
            fi
            sleep 3
          done

          echo "Container failed to become ready"
          docker logs api
          docker rm -f api >/dev/null
          exit 1

      - name: Verify migrations created the expected schema
        # Guards against a migration that "runs" but silently produces nothing —
        # pgvector in particular fails quietly if the extension is unavailable.
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16-alpine \
            psql -h localhost -U postgres -d sentellent -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" \
            | tee /tmp/count
          test "$(cat /tmp/count)" -ge 12 || { echo "expected >=12 tables"; exit 1; }

          docker run --rm --network host -e PGPASSWORD=postgres postgres:16-alpine \
            psql -h localhost -U postgres -d sentellent -tAc \
            "SELECT extname FROM pg_extension WHERE extname='vector'" | grep -q vector \
            && echo "pgvector extension present"
