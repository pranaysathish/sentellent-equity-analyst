name: Deploy to AWS

# Push to main -> live. Authentication is via GitHub OIDC: the workflow presents
# a short-lived signed token and assumes an IAM role scoped to this repository.
# There are no AWS access keys stored anywhere in this repo or its settings.
#
# Both halves are published first, then a single SSM command rolls them out
# together, so the instance never serves a new frontend against an old API.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-deploy without an empty commit

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy mid-flight

permissions:
  contents: read
  id-token: write # required to request the OIDC token

jobs:
  ci:
    name: Gate on CI
    uses: ./.github/workflows/ci.yml

  publish-backend:
    name: Publish backend image
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gha-backend-${{ github.run_id }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Two tags: an immutable one per commit so any deploy can be traced
          # back and rolled back to, and `latest` which the host pulls.
          tags: |
            ${{ secrets.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend:
    name: Publish frontend build
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static export
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gha-frontend-${{ github.run_id }}

      - name: Upload build to S3
        working-directory: frontend
        # S3 is the artefact store; the instance pulls from here during
        # rollout. Caching is handled by nginx, so no cache headers needed.
        run: |
          aws s3 sync out/ "s3://${{ secrets.S3_BUCKET }}/frontend/" --delete
          echo "Published $(find out -type f | wc -l) files"

  rollout:
    name: Roll out to the instance
    needs: [publish-backend, publish-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gha-rollout-${{ github.run_id }}

      - name: Find the current instance
        id: target
        # Resolved by tag rather than read from a repository secret. The
        # instance is replaced whenever its configuration changes, and a
        # pinned ID silently goes stale — the deploy then fails with an
        # authorisation error that says nothing about the real cause.
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sentellent-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "No running instance tagged sentellent-app"; exit 1
          fi
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Deploying to $ID"

      - name: Trigger deploy via SSM
        id: rollout
        # SSM Run Command rather than SSH: no bastion, no open port 22, no key
        # pair in GitHub secrets. The instance pulls both artefacts itself.
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.target.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ needs.publish-backend.outputs.image_tag }}" \
            --parameters 'commands=["/opt/sentellent/deploy.sh"]' \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command $COMMAND_ID"

      - name: Wait for rollout
        run: |
          for i in $(seq 1 45); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.rollout.outputs.command_id }}" \
              --instance-id "${{ steps.target.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "attempt $i: $STATUS"
            case "$STATUS" in
              Success) echo "Rollout complete"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "--- stdout ---"
                aws ssm get-command-invocation \
                  --command-id "${{ steps.rollout.outputs.command_id }}" \
                  --instance-id "${{ steps.target.outputs.instance_id }}" \
                  --query "StandardOutputContent" --output text | tail -30
                echo "--- stderr ---"
                aws ssm get-command-invocation \
                  --command-id "${{ steps.rollout.outputs.command_id }}" \
                  --instance-id "${{ steps.target.outputs.instance_id }}" \
                  --query "StandardErrorContent" --output text | tail -30
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the rollout"
          exit 1

  verify:
    name: Verify the live site
    needs: rollout
    runs-on: ubuntu-latest

    steps:
      - name: Health check through the public URL
        # The deploy is only green if the public URL actually serves both the
        # API and the app. Anything less is a deploy that "succeeded" onto a
        # broken site.
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "Checking $APP_URL"

          for i in $(seq 1 20); do
            if curl -fsS "$APP_URL/api/health/ready" | tee /dev/stderr | grep -q '"status":"ready"'; then
              echo "API is ready"
              break
            fi
            if [ "$i" = "20" ]; then echo "API never became ready"; exit 1; fi
            sleep 15
          done

          curl -fsS "$APP_URL/" | grep -qi "sentellent" \
            && echo "Frontend is serving" \
            || { echo "Frontend did not serve expected content"; exit 1; }

          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${GITHUB_SHA::12}\`" >> "$GITHUB_STEP_SUMMARY"
